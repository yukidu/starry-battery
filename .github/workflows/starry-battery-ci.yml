name: Starry Battery standalone CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: starry-battery-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  battery-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Node Engine Gateway Archive and Release tests
        run: node --test test/*.test.mjs
      - name: SQLite schema and forward-only migrations
        run: |
          python3 test/battery_schema_test.py
          python3 test/battery_migration_test.py
      - name: Validate Battery module syntax
        run: |
          node --check engine.mjs
          node --check worker.mjs
          node --check archive.mjs
          node --check deploy/generate-config.mjs
          node --check deploy/verify-battery-cloudflare.mjs
      - name: Check isolated Preview config and disabled finance switches
        env:
          BATTERY_TARGET: preview
          BATTERY_D1_ID: "cd93105f-7963-4a0d-bbb5-fc11e4555a5e"
          BATTERY_D1_NAME: "starry-battery-overdraft-preview-20261024"
          BATTERY_R2_BUCKET: "starry-battery-ledger-preview-20261024"
        run: |
          node deploy/generate-config.mjs
          node --input-type=module -e "import fs from 'node:fs';const e=JSON.parse(fs.readFileSync('.wrangler.engine.generated.json'));const g=JSON.parse(fs.readFileSync('.wrangler.gateway.generated.json'));const a=JSON.parse(fs.readFileSync('.wrangler.archive.generated.json'));if(e.name!=='starry-battery-engine-preview-v2-20261024'||g.name!=='starry-battery-gateway-preview-v2-20261024'||a.name!=='starry-battery-archive-preview-v2-20261024'||e.vars.BATTERY_OPERATIONS_ENABLED!=='false'||e.vars.BATTERY_CREDIT_ENABLED!=='false'||e.vars.BATTERY_OVERDRAFT_ENABLED!=='false'||a.vars.BATTERY_ARCHIVE_ENABLED!=='false'||g.r2_buckets[0].bucket_name!=='starry-battery-ledger-preview-20261024')process.exit(1)"
          rm .wrangler.*.generated.json
      - name: Reject manifest mismatch and Central D1 accidentally configured as Battery
        env:
          BATTERY_TARGET: preview
          BATTERY_D1_ID: "ca08ee86-7b39-46fe-a578-611d1bee312c"
          BATTERY_D1_NAME: "starry-battery-overdraft-preview-20261024"
          BATTERY_R2_BUCKET: "starry-battery-ledger-preview-20261024"
        run: |
          if node deploy/generate-config.mjs; then echo "ERROR: Central D1 accepted"; exit 1; fi
      - name: Verify cross-App and Central auth boundaries
        run: |
          test -f CENTRAL_AUTH_BINDING_CONTRACT.md
          test -f deploy/battery-targets.json
          node --input-type=module -e "import fs from 'node:fs';const x=JSON.parse(fs.readFileSync('rules-catalog.json'));if(x.production_ready!==false)process.exit(1)"
      - name: Independent Cloudflare Preview health and missing-auth smoke
        run: |
          set -eu
          base="https://starry-battery-gateway-preview-v2-20261024.yukidu.workers.dev"
          curl --fail --silent --show-error --retry 3 --max-time 15 "$base/health" -o /tmp/starry-battery-preview-health.json
          node --input-type=module -e "import fs from 'node:fs';const x=JSON.parse(fs.readFileSync('/tmp/starry-battery-preview-health.json'));if(x.service!=='starry-battery-gateway'||x.status!=='reachable')process.exit(1)"
          status="$(curl --silent --show-error --retry 3 --max-time 15 -o /tmp/starry-battery-preview-denial.json -w '%{http_code}' "$base/v1/battery/wallet")"
          test "$status" = "503"
          node --input-type=module -e "import fs from 'node:fs';const x=JSON.parse(fs.readFileSync('/tmp/starry-battery-preview-denial.json'));if(x.error!=='dependency_unavailable')process.exit(1)"
      - name: Confirm no Production deployment by CI
        run: echo "Tests only; production feature flags remain off."
